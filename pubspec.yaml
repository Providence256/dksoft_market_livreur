name: dksoft_market_livreur
description: "Application motard livreur de Dksoft Market."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  hugeicons: ^1.1.7
  intl: ^0.20.3
  riverpod: ^3.3.2
  toastification: ^3.2.0
  firebase_storage: ^13.6.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  google_maps_flutter: ^2.18.2
  geolocator: ^14.1.1
  flutter_polyline_points: ^3.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
